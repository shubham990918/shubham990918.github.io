<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Shinde</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            overflow-x: hidden;
        }

        .hero {

            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            background:
            linear-gradient(
            rgba(0,0,0,0.7),
            rgba(0,0,0,0.9)
            ),

            url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1974&auto=format&fit=crop');

            background-size: cover;
            background-position: center;
        }

        h1 {

            font-size: 70px;
            margin-bottom: 10px;

            color: #00e5ff;

            text-shadow:
            0 0 10px #00e5ff,
            0 0 20px #00e5ff;
        }

        h2 {

            color: #ff003c;
            font-weight: normal;
        }

        .skills {

            margin-top: 30px;
        }

        .skills span {

            border: 1px solid #00e5ff;

            padding: 10px 20px;

            margin: 10px;

            display: inline-block;

            border-radius: 30px;

            color: #00e5ff;
        }

        .btn {

            margin-top: 40px;

            padding: 15px 30px;

            background: #ff003c;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            transition: 0.3s;
        }

        .btn:hover {

            background: #00e5ff;
            color: black;
        }

    </style>

</head>

<body>

    <section class="hero">

        <h1>Shubham Shinde</h1>

        <h2>
            Middleware Engineer | Linux | AWS | DevOps
        </h2>

        <div class="skills">

            <span>Linux</span>
            <span>AWS</span>
            <span>WebLogic</span>
            <span>DevOps</span>
            <span>IAM</span>
            <span>PAM</span>

        </div>

        <a class="btn"
        href="https://github.com/shubham990918">

            Visit GitHub

        </a>

    </section>

</body>
</html>
